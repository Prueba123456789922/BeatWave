# BeatWave · crea el APK automáticamente en GitHub (no necesitas Android Studio).
# Cada vez que subas cambios a la rama principal, ve a Actions → «Android APK» → Artifacts → BeatWave-debug-apk.
name: Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core @capacitor/app @capacitor/android @capacitor/local-notifications @capacitor-community/admob
          npm install -D @capacitor/cli esbuild
      - name: Preparar la carpeta web
        run: node tools/copy-www.js
      - name: Crear el proyecto Android
        run: npx cap add android
      - name: Ajustes de BeatWave
        run: node tools/patch-android.js
      - name: Sincronizar
        run: npx cap sync android
      - name: Compilar APK
        run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: BeatWave-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
