# BeatWave · crea el APK automáticamente en GitHub (no necesitas Android Studio).
# Cada vez que subas cambios a la rama principal, ve a Actions → «Android APK» → Artifacts → BeatWave-debug-apk.
name: Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar Capacitor
        run: |
          npm install @capacitor/core @capacitor/app @capacitor/android @capacitor/local-notifications @capacitor-community/admob
          npm install -D @capacitor/cli esbuild
      - name: Preparar la carpeta web
        run: node tools/copy-www.js
      - name: Crear el proyecto Android
        run: npx cap add android
      - name: Ajustes de BeatWave
        run: node tools/patch-android.js
      - name: Icono de la app (el logo de BeatWave)
        run: |
          pip install pillow
          python tools/make_icons.py
      - name: Sincronizar
        run: npx cap sync android
      - name: Compilar APK
        run: ./gradlew assembleDebug
        working-directory: android
      - name: Comprobar que el APK lleva el icono de BeatWave
        run: |
          ls -la android/app/src/main/res/mipmap-xxxhdpi/
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 2>/dev/null | tail -1)
          if [ -n "$AAPT" ]; then $AAPT dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -E "application-icon|launchable-activity" || true; fi
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -i -E "ic_launcher|splash" || true
      - uses: actions/upload-artifact@v4
        with:
          name: BeatWave-icono
          path: android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - uses: actions/upload-artifact@v4
        with:
          name: BeatWave-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
